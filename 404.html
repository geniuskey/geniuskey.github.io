<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="3;url=/" />
  <title>페이지를 찾을 수 없습니다 | Euiyun Pages</title>
  <style>
    :root { --bg: #f7f7f5; --text: #16181d; --muted: #62666f; --accent: #2f6bff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0d12; --text: #e9ebf0; --muted: #9096a3; --accent: #6d97ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; text-align: center; padding: 16px; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>요청한 페이지가 없습니다. 잠시 후 프로젝트 목록으로 이동합니다.</p>
    <a href="/">프로젝트 목록 보기 &rarr;</a>
  </div>
</body>
</html>
